name: Build docs for Pages (main /docs)

# Build the Vite site into ./docs and commit it back to main, so GitHub Pages
# can serve from: Settings → Pages → Deploy from a branch → main → /docs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    # Avoid an infinite loop: skip runs whose head commit is the bot's own
    # docs commit.
    if: "!contains(github.event.head_commit.message, 'chore: build docs')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build into docs/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          rm -rf docs
          npx vite build --outDir docs
          cp docs/index.html docs/404.html
          touch docs/.nojekyll

      - name: Commit docs back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No docs changes."
          else
            git commit -m "chore: build docs [skip ci]"
            git push
          fi
