# Konfigurasi deploy Netlify untuk portofolio Wiliam (SPA Vite + React).
#
# Repo bersifat multi-proyek, jadi base diarahkan ke folder app ini.
# SITE_URL tidak di-hardcode: Netlify menyediakan `URL` (domain produksi) yang
# dibaca vite.config.ts untuk metadata absolut. Set SITE_URL manual di
# dashboard hanya bila memakai domain kustom.

[build]
  base    = "apps/wiliam-portfolio"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: rute non-file dilayani index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Header keamanan dasar. Tidak ada skrip pihak ketiga, jadi bisa ketat.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "DENY"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# Aset ber-hash dari Vite aman di-cache selamanya.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
